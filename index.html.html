<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cerca corsi gratuiti</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a1113;--side:#0e181b;--card:#101d21;--tx:#e6f1f0;--mu:#8aa3a4;--bd:#1d3338;--ac:#2dd4bf;--ac2:#14b8a6;--acbg:rgba(45,212,191,.12)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(900px 400px at 80% -10%,rgba(45,212,191,.10),transparent),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{background:var(--side);border-right:1px solid var(--bd);padding:22px 18px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;margin-bottom:22px}
.logo i{width:12px;height:12px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
aside label{display:block;color:var(--mu);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:16px 0 6px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;outline:none}
select{appearance:none;-webkit-appearance:none;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--ac) 50%),linear-gradient(135deg,var(--ac) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acbg)}
option{background:var(--card);color:var(--tx)}
button{border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:10px;padding:9px 12px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--ac);color:#04201c}
#reset{width:100%;margin-top:22px}
main{padding:28px 28px 48px;max-width:960px;width:100%}
h1{font-size:28px;margin:0 0 4px;letter-spacing:-.01em}
h1 b{color:var(--ac)}
.sub{color:var(--mu);margin:0 0 18px}
.bar{color:var(--mu);margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--bd)}
.bar b{color:var(--ac)}
.card{position:relative;background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--ac2);border-radius:12px;padding:16px 18px;margin-bottom:12px;transition:.15s}
.card:hover{border-color:var(--ac);transform:translateY(-1px);box-shadow:0 6px 24px rgba(45,212,191,.08)}
.card h3{margin:6px 0;font-size:17px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--acbg);color:var(--ac);border-radius:999px;padding:2px 10px;font-size:12px}
.tag.o{background:transparent;border:1px solid var(--bd);color:var(--mu)}
.meta{color:var(--mu);font-size:13px}
.card a.go{display:inline-block;margin-top:10px;color:#04201c;background:var(--ac);padding:6px 14px;border-radius:8px;text-decoration:none;font-weight:700;font-size:13px}
.card a.go:hover{background:#5eead4}
details{margin-top:26px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 16px}
summary{cursor:pointer;font-weight:600;color:var(--ac)}
.src{display:flex;gap:10px;align-items:baseline;margin:8px 0;flex-wrap:wrap}
.src span{min-width:130px;color:var(--mu)}
.src a{overflow-wrap:anywhere;color:var(--ac)}
.star{position:absolute;top:10px;right:12px;width:auto;border:0;background:none;color:var(--mu);font-size:22px;line-height:1;padding:4px 6px}
.star:hover{background:none;color:var(--ac)}
.star.on{color:#fcd34d}
.chk{display:flex;gap:8px;align-items:center;margin-top:18px;color:var(--tx);cursor:pointer}
.chk input{width:auto;accent-color:var(--ac)}
.empty{text-align:center;color:var(--mu);padding:40px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--bd)}main{padding:20px 16px 40px}}
</style>
</head>
<body>
<div class="wrap">
<aside>
<div class="logo"><i></i>Corsi Finder</div>
<label for="q">Cerca</label>
<input id="q" type="search" placeholder="Titolo, area, parola chiave…">
<label for="fe">Ente</label>
<select id="fe"><option value="">Tutti gli enti</option></select>
<label for="fa">Area</label>
<select id="fa"><option value="">Tutte le aree</option></select>
<label for="fm">Modalità</label>
<select id="fm"><option value="">Tutte le modalità</option></select>
<label for="fd">Mese di inizio</label>
<select id="fd"><option value="">Qualsiasi mese</option></select>
<label class="chk"><input type="checkbox" id="fv"> Solo i miei preferiti ★</label>
<button id="reset">Azzera filtri</button>
</aside>
<main>
<h1>Cerca <b>corsi gratuiti</b></h1>
<p class="sub">Tutti gli enti in un unico elenco, con link alla scheda originale.</p>
<div class="bar"><b id="n"></b></div>
<div id="list"></div>
<details>
<summary>Fonti dei dati</summary>
<div id="src"></div>
<p class="meta">Dati aggiornati al: <b id="upd"></b></p>
</details>
</main>
</div>

<script>
/* ============================================================
   1) QUI VANNO I 3 LINK DA CUI RACCOGLIERE I DATI
   (sono le pagine che lo scraper dovrà leggere)
   ============================================================ */
const SOURCES = [
  { ente: "Umana Forma",       url: "https://www.umanaforma.it/per-le-persone/corsi/?k&ar&ca=corsi-finanziati&st&co=1&se" },
  { ente: "Talentform",        url: "https://www.talentform.it/calendario-corsi-gratuiti/corsi-gratuiti-di-informatica/" },
  { ente: "Challenge Network", url: "https://www.challengenetwork.it/proclass/formazione-professionale/" },
  { ente: "Attal Group",       url: "https://formazione.attalgroup.it/categoria/corsi-online/" }
];

/* ============================================================
   2) QUI VANNO I DATI DEI CORSI
   Ora sono un esempio inserito a mano. Quando lo scraper è pronto,
   sostituisci questo blocco con: fetch('corsi.json') (vedi sotto)
   Formato: { ente, titolo, area, modalita, inizio, fine, link }
   ============================================================ */
const TF="https://www.talentform.it/formazione-professionale/", CN="https://www.challengenetwork.it/proclass/";
const tf=(t,a,i,f,slug)=>({ente:"Talentform",titolo:t,area:a,modalita:"Aula virtuale",inizio:i,fine:f,link:TF+slug+"/?occurrence="+i});
const cn=(t,a,i,f,slug)=>({ente:"Challenge Network",titolo:t,area:a,modalita:"Aula virtuale",inizio:i,fine:f,link:CN+slug+"/"});
let COURSES = [
 tf("Sistemista Informatico, Cybersecurity e AI","Informatica","2026-10-07","2026-11-18","sistemista-informatico-cybersecurity-e-ai-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3057"),
 tf("Data Analyst con Excel e Python","Informatica","2026-10-13","2026-11-24","data-analyst-con-excel-e-python-corso-gratuito-online-full-time-id-3049"),
 tf("Mobile App Developer","Informatica","2026-10-15","2026-11-26","mobile-app-developer-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3064"),
 tf("Specialista Tecnico: Help Desk Informatico","Informatica","2026-10-15","2026-11-26","specialista-tecnico-help-desk-informatico-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3065"),
 tf("Sviluppatore Front End","Informatica","2026-10-16","2026-11-27","sviluppatore-front-end-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3061"),
 tf("Programmatore in Python","Informatica","2026-10-16","2026-11-27","programmatore-in-python-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3063"),
 tf("Sviluppatore Full Stack con Laravel, PHP e JavaScript","Informatica","2026-10-19","2026-11-30","sviluppatore-full-stack-con-laravel-php-e-javascript-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3076"),
 tf("Tecnico di Rete (Network Administrator)","Informatica","2026-10-19","2026-11-30","tecnico-di-rete-network-administrator-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3082"),
 tf("Sviluppatore Web: Python e Django per il Back End","Informatica","2026-10-19","2026-11-30","sviluppatore-web-python-e-django-per-il-back-end-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3083"),
 tf("Programmatore Java","Informatica","2026-10-19","2026-11-30","programmatore-java-corso-gratuito-online-full-time-in-aula-virtuale-sincrona-id3102"),
 cn("HR Training Specialist: Progettare e Gestire la Formazione","HR","2026-10-05","2026-11-10","hr-training-specialist-progettare-e-gestire-la-formazione"),
 cn("HR Talent Development Specialist","HR","2026-11-05","2026-12-15","hr-talent-development-specialist"),
 cn("Europrogettazione","Progettazione & Management","2026-10-07","2026-11-18","europrogettazione"),
 cn("Project Manager","Progettazione & Management","2026-11-09","2026-12-22","project-manager-2"),
 cn("Digital & Social Media Marketing Specialist","Digital / Marketing","2026-10-08","2026-11-18","corso-gratuito-di-digital-social-media-marketing-specialist"),
 cn("Digital Tech Specialist: Marketing, AI ed Innovazione","Digital / Marketing","2026-11-05","2026-12-15","digital-tech-specialist-marketing-ai-ed-innovazione-3"),
 cn("Impiegato Contabile","Amministrativa / Segreteria","2026-10-12","2026-11-17","impiegato-contabile"),
 cn("Addetto Buste Paga","Amministrativa / Segreteria","2026-11-09","2026-12-22","addetto-buste-paga-3")
];
let LAST_UPDATE = "06/10/2026";

/* Quando avrai lo scraper, decommenta e usa questo al posto dei dati sopra:
fetch('corsi.json').then(r=>r.json()).then(d=>{COURSES=d.corsi;init();}); */

const MESI=["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
const $=id=>document.getElementById(id);
const fmt=d=>{const[y,m,g]=d.split("-");return `${+g} ${MESI[+m-1].slice(0,3)} ${y}`};
let FAV=new Set();try{FAV=new Set(JSON.parse(localStorage.getItem("fav")||"[]"))}catch(e){}
const saveFav=()=>{try{localStorage.setItem("fav",JSON.stringify([...FAV]))}catch(e){}};
const uniq=k=>[...new Set(COURSES.map(c=>c[k]))].sort();
function fill(sel,vals,lab){vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=lab?lab(v):v;$(sel).appendChild(o)})}

function render(){
  const q=$("q").value.toLowerCase().trim(), fe=$("fe").value, fa=$("fa").value, fm=$("fm").value, fd=$("fd").value;
  const r=COURSES.filter(c=>(!q||(c.titolo+" "+c.area+" "+c.ente).toLowerCase().includes(q))&&(!fe||c.ente===fe)&&(!fa||c.area===fa)&&(!fm||c.modalita===fm)&&(!fd||c.inizio.slice(0,7)===fd)&&(!$("fv").checked||FAV.has(c.link)))
    .sort((a,b)=>a.inizio.localeCompare(b.inizio));
  $("n").textContent=r.length+" corsi trovati";
  $("list").innerHTML=r.length?r.map(c=>`<div class="card"><button class="star${FAV.has(c.link)?" on":""}" data-l="${c.link}" title="Segna come interessante">★</button><div class="tags"><span class="tag">${c.ente}</span><span class="tag o">${c.area}</span><span class="tag o">${c.modalita}</span></div><h3>${c.titolo}</h3><div class="meta">Dal ${fmt(c.inizio)} al ${fmt(c.fine)}</div><a class="go" href="${c.link}" target="_blank" rel="noopener">Vai alla scheda del corso →</a></div>`).join(""):`<div class="empty">Nessun corso trovato con questi filtri.</div>`;
}
function init(){
  fill("fe",uniq("ente"));fill("fa",uniq("area"));fill("fm",uniq("modalita"));
  fill("fd",[...new Set(COURSES.map(c=>c.inizio.slice(0,7)))].sort(),v=>{const[y,m]=v.split("-");return MESI[+m-1]+" "+y});
  $("src").innerHTML=SOURCES.map(s=>`<div class="src"><span>${s.ente}</span><a href="${s.url}" target="_blank" rel="noopener">${s.url}</a></div>`).join("");
  $("upd").textContent=LAST_UPDATE;
  ["q","fe","fa","fm","fd","fv"].forEach(i=>$(i).addEventListener("input",render));
  $("list").addEventListener("click",e=>{const b=e.target.closest(".star");if(!b)return;const l=b.dataset.l;FAV.has(l)?FAV.delete(l):FAV.add(l);saveFav();render()});
  $("reset").onclick=()=>{["q","fe","fa","fm","fd"].forEach(i=>$(i).value="");$("fv").checked=false;render()};
  render();
}
fetch("corsi.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(d=>{COURSES=d.corsi;if(d.aggiornato)LAST_UPDATE=d.aggiornato}).catch(()=>{}).finally(init);
</script>
</body>
</html>
